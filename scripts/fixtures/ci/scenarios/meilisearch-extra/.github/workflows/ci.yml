name: CI

on:
  pull_request:

jobs:
  fmt:
    runs-on: macos-14
    defaults:
      run:
        working-directory: vortex-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            vortex-core/target
          key: x
      - run: cargo fmt --all -- --check
  clippy:
    runs-on: macos-14
    defaults:
      run:
        working-directory: vortex-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            vortex-core/target
          key: x
      - run: cargo clippy --workspace -- -D warnings
  test:
    runs-on: macos-14
    defaults:
      run:
        working-directory: vortex-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            vortex-core/target
          key: x
      - run: cargo test --workspace
  domain-deps:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-domain-deps.sh
  meilisearch:
    runs-on: macos-14
    steps:
      - run: curl -fsS https://example.com/Meilisearch
