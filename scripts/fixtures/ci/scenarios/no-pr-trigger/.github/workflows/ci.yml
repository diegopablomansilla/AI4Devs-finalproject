name: CI

on:
  push:
    branches:
      - develop

jobs:
  fmt:
    runs-on: macos-14
    defaults:
      run:
        working-directory: vortex-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            vortex-core/target
          key: x
      - run: cargo fmt --all -- --check
  clippy:
    runs-on: macos-14
    defaults:
      run:
        working-directory: vortex-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            vortex-core/target
          key: x
      - run: cargo clippy --workspace -- -D warnings
  test:
    runs-on: macos-14
    defaults:
      run:
        working-directory: vortex-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            vortex-core/target
          key: x
      - run: cargo test --workspace
