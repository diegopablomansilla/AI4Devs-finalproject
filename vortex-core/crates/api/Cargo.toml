[package]
name = "api"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
axum = { workspace = true }
domain = { path = "../domain" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tower-http = { workspace = true, features = ["limit", "timeout", "compression-gzip", "compression-br", "trace"] }
tracing = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time", "test-util"] }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
jsonschema = { workspace = true, default-features = false }
serde_yaml = { workspace = true }

[lints]
workspace = true
